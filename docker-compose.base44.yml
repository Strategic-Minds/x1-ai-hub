services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - base44_cli:/root/.base44
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npm install -g base44@latest && curl -fsSL https://deno.land/install.sh | DENO_DIR=/root/.deno sh - && sleep infinity"
    tty: true
    stdin_open: true

volumes:
  base44_cli:
