services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - base44_cli:/root/.base44
      - deno_bin:/root/.deno
      - npm_global:/root/.npm-global
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npm install -g base44@latest && ([ -f /root/.deno/bin/deno ] || (curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.0.0/deno-x86_64-unknown-linux-gnu.zip && unzip -o /tmp/deno.zip -d /root/.deno/bin)) && export PATH=/root/.deno/bin:/root/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin && base44 dev"
    tty: true
    stdin_open: true

volumes:
  base44_cli:
  deno_bin:
  npm_global:
